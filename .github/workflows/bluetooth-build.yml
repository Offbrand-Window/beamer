name: Bluetooth prototype
on:
  push:
    branches: [bluetooth-transport]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r win_app/requirements-win.txt
      - name: Bluetooth transport tests
        run: python -m unittest core.tests.test_bluetooth -v
      - name: Windows regression tests
        working-directory: win_app
        run: python -m unittest discover -s tests -q
      - name: Build executable
        working-directory: win_app
        run: python -m PyInstaller --noconfirm build.spec
      - name: Verify frozen imports
        run: python tools/import_probe.py win win_app/dist/Beamer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Beamer-Bluetooth-Windows
          path: win_app/dist/Beamer.exe
